<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkBuddy 每日签到 · 结果面板</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0f172a; color:#e2e8f0; font:14px/1.6 "Segoe UI",system-ui,sans-serif; padding:32px 16px; }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#94a3b8; font-size:13px; margin-bottom:24px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:14px 16px; }
  .card .k { color:#94a3b8; font-size:12px; }
  .card .v { font-size:24px; font-weight:600; margin-top:2px; }
  .card .v small { font-size:13px; color:#94a3b8; font-weight:400; }
  .pos { color:#34d399; } .neg { color:#f87171; } .zero { color:#94a3b8; }
  .chart { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:16px; margin-bottom:12px; }
  .chart h2 { font-size:15px; margin-bottom:10px; color:#e2e8f0; }
  table { width:100%; border-collapse:collapse; background:#1e293b; border:1px solid #334155; border-radius:10px; overflow:hidden; font-size:13px; }
  th, td { padding:8px 10px; text-align:left; border-bottom:1px solid #1e293b; }
  th { background:#334155; color:#e2e8f0; font-weight:600; }
  tr:last-child td { border-bottom:none; }
  td.zero { color:#94a3b8; }
  .foot { color:#64748b; font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌱 WorkBuddy 每日签到 · 结果面板</h1>
  <div class="sub">数据来源：本机计划任务日志 · 更新时间：2026-09-24 12:01</div>

  <div class="cards">
    <div class="card"><div class="k">当前积分</div><div class="v">2802</div></div>
    <div class="card"><div class="k">今日获得</div><div class="v"><span class="zero">±0</span></div></div>
    <div class="card"><div class="k">等级 / 能量</div><div class="v">15 <small>/ 5</small></div></div>
    <div class="card"><div class="k">连续签到</div><div class="v">7 <small>天</small></div></div>
    <div class="card"><div class="k">任务完成</div><div class="v">15/19</div></div>
  </div>

  <div class="chart"><h2>积分变化</h2><svg viewBox="0 0 640 220" style="width:100%;max-width:640px;height:auto"><rect x="112.8" y="110.0" width="414.4" height="86.0" rx="3" fill="#f59e0b" opacity="0.85"/><text x="320.0" y="212.0" font-size="9" fill="#9ca3af" text-anchor="middle">24</text><text x="320.0" y="106.0" font-size="9" fill="#e5e7eb" text-anchor="middle">2802</text></svg></div>
  <div class="chart"><h2>每日获得积分</h2><svg viewBox="0 0 640 220" style="width:100%;max-width:640px;height:auto"><rect x="112.8" y="196.0" width="414.4" height="0.0" rx="3" fill="#10b981" opacity="0.85"/><text x="320.0" y="212.0" font-size="9" fill="#9ca3af" text-anchor="middle">24</text><text x="320.0" y="192.0" font-size="9" fill="#e5e7eb" text-anchor="middle">0</text></svg></div>

  <div class="chart"><h2>明细</h2>
    <table><thead><tr><th>日期</th><th>周</th><th>剩余积分</th><th>当日获得</th><th>等级</th><th>连签</th><th>能量</th><th>完成</th></tr></thead>
    <tbody><tr><td>2026-09-24</td><td>Thu</td><td>2802.0</td><td>—</td><td>15</td><td>7 天</td><td>5</td><td>15/19</td></tr></tbody></table>
  </div>

  <div class="foot">生成脚本：parse.py + render.py · 日志保留 30 天 · 自动每日更新</div>
</div>
</body>
</html>
